# -----------------------------------------------------------------------------
# Cadastral Map Vectorisation Toolkit - pipeline configuration
#
# All paths are relative to the repo root.
# Values are grouped by the pipeline step that uses them.
# Metric thresholds use linear CRS units (typically metres).
# -----------------------------------------------------------------------------

# Data and model directories
paths:
  raw:              data/raw/
  masks:            data/map_area_masks/
  patches:          data/patches/
  annotations:      data/annotations/
  predictions:      data/predictions/
  stitched:         data/stitched/
  outputs:          data/outputs/
  outputs_mended:   data/mended outputs/   # hand-corrected GeoPackages; written to only with --mended
  models_base:      models/base/
  models_finetuned: models/finetuned/
  logs:             models/logs/
  parcel_points:    data/parcel_points/


# Optional: reproject georeferenced maps before patchification.
# Required for inputs whose CRS is not a projected metre-based CRS.
reproject:
  target_crs: EPSG:27700   # default British National Grid (metres); set to your CRS if different
  resolution: 0.5          # metres per pixel - matches the ~0.5 m/px training data
  resampling: bilinear     # options: nearest,  bilinear,  cubic,  lanczos, average

# Slicing raw map into patches
patchify:
  patch_size:        512    # px - MapSAM use 512px patches directly
  overlap:           0      # px between adjacent patches
  min_mask_coverage: 0.01   # fraction of a patch inside the mask (0.01 = 1%)
  pad_value:         255    # fill value for edge patches (255 = white)

# Boundary-line U-Net
unet:
  inference_size: 256    # 512px patches are split into 2x2 256px tiles
  image_channels: 1      # grayscale
  loss_type:      combined_focal_cldice
  threshold:      0.95   # Calibrated on the validation set
  batch_size:     4

# Dashed-line U-Net using an EfficientNetB0 encoder and Gaussian heatmap target.
# Trained as one pooled model across all annotated sheets.
dashed:
  img_size:            512    # native patch size
  sigma:               8      # Gaussian blur radius in pixels
  foreground_weight:   15.0   # Loss weight for on-line pixels
  unfreeze_from_layer: block6a_expand_activation   # Start on Phase 2 unfreezing
  batch_size:          4
  batch_size_finetune: 2      # Phase 2 batch size; reduced to avoid OOM
  epochs:              60
  learning_rate:       0.0001
  finetune_lr_divisor: 50     # Phase 2 LR = learning_rate / this
  val_split:           0.15
  seed:                42
  predict_threshold:   0.70   # Threshold sweep; best F1 ~0.59

# Vectorising stitched prediction rasters to GeoPackage layers.
vectorise:
  boundaries:
    simplify_tolerance: 2.0    # Douglas-Peucker tolerance in CRS units
    min_length:         10.0   # discard lines shorter than this
    topology_repair:
      enabled:         false   # Add bridging segments after vectorisation
      snap_distance:   15.0    # maximum gap to bridge, in CRS units
      angle_tolerance: null    # null = any nearby endpoint pair; degrees otherwise
                               #   (avoids bridging two unrelated boundaries at a corner)
                               #   e.g. 25 to restrict to roughly collinear lines only
  dashed:
    simplify_tolerance: 2.0
    min_length:         10.0
    topology_repair:
      enabled:         false   # Enable if traced output remains too fragmented
      snap_distance:   15.0
      angle_tolerance: null

  #MapSAM polygon features. Specific entries override "default".
  features:
    default:
      simplify_tolerance: 2.0    # Douglas-Peucker tolerance in CRS units
      min_area:           25.0   # discard polygons smaller than this (same units squared)
    # Per-feature overrides - uncomment and adjust as needed. e.g.
    # water:
    #   simplify_tolerance: 3.0
    #   min_area: 50.0
    # building:
    #   simplify_tolerance: 1.0
    #   min_area: 10.0

# ---------------------------------------------------------------------------
# MapSAM feature segmentation
# ---------------------------------------------------------------------------
# SAM ViT-B with DoRA adapters.
#
# No per-feature configuration is required. The feature name is supplied via
# the --feature CLI argument, and weights are resolved automatically in this
# order:
#   1. models/finetuned/mapsam_<feature>*_best.pth
#   2. models/base/MapSAM/<feature>/          (feature-specific base weights)
#   3. models/base/MapSAM/original_weights/   (generic SAM DoRA fallback)
#
# Annotation data is read from:
mapsam:
  vit_name:           vit_b
  img_size:           512
  num_classes:        1
  # DoRA configuration
  # Must match the rank used when the base weights were trained
  rank:               4
  #combined loss weighting
  #0.8 = 80% dice, 20% focal
  dice_param:         0.8
  # Binary mask threshold applied to sigmoid predictions during inference.
  predict_threshold:  0.5
  # Number of patches processed per GPU forward pass.
  # Reduce to 1-2 if you encounter CUDA out-of-memory errors.
  predict_batch_size: 4

  finetune:
    epochs:                  30
    batch_size:              2        # Safe for ~4 GB GPU at 512px with SAM ViT-B; reduce to 1 if OOM.
    learning_rate:           0.0001   # Lower than base training (0.005); fine-tuning makes only small weight updates.
    val_split:               0.15
    early_stopping_patience: 10
    seed:                    1234

# ---------------------------------------------------------------------------
# Boundary U-Net fine-tuning
# ---------------------------------------------------------------------------
# Implemented by steps/03_finetune/lines/train.py.
finetune:
  epochs:                  50
  learning_rate:           0.0001   # Lower than the build_model default (1e-3) for fine-tuning.
  val_split:               0.15     # Fraction of patches held out for validation.
  apl_tau:                 3        # Coverage tolerance in pixels for APL / Path-F1.
  max_val_tiles:           200      # Maximum validation tiles evaluated per epoch.
  early_stopping_patience: 10       # Stop if Path-F1 fails to improve for this many epochs.

  # The checkpoint metric is always Path-F1 and is intentionally not configurable.


# ---------------------------------------------------------------------------
# Boundary feedback fine-tuning
# ---------------------------------------------------------------------------
# Step 06, run AFTER mending in QGIS.
#
# Before training:
#   1. Run lines/prepare.py (maptools).
#   2. Run lines/train.py (lines).
#
# Feedback tiles are combined with a replay pool of ground-truth tiles.
feedback:
  replay_ratio:            0.4      # 40% ground-truth replay tiles + 60% feedback tiles per batch.
  feedback_loss_weight:    0.8      # Pseudo-label loss weight; ground-truth tiles use a weight of 1.0.

  # Freeze the first N of the 4 encoder stages.
  #   0 = freeze none
  #   4 = freeze all
  #
  # The first two stages primarily learn low-level edge/texture features.
  # Freezing them helps preserve cross-map generalisability.
  freeze_encoder_blocks:   2

  learning_rate:            1.0e-5   # Much lower than initial fine-tuning (1e-4); only a small weight update.
  epochs:                   20
  early_stopping_patience:  5        # Stop when cross-sheet Path-F1 stops improving.
  max_val_tiles:            200      # Maximum validation tiles evaluated per epoch.


# ---------------------------------------------------------------------------
# Annotation export
# ---------------------------------------------------------------------------
# Implemented by steps/02_annotate/export_masks.py.
#
# Every unique LabelMe label becomes its own feature class. 
# The label name is used directly as the annotations subfolder:
#
#   water -> data/annotations/water/
#
# boundary_label is rendered as a linestrip. All other labels are rendered as filled polygons.
annotation:
  boundary_label: boundary
  line_width:     3    # Pixel width used when rendering linestrip annotations into masks.


# ---------------------------------------------------------------------------
# Point-seeded watershed parcel extraction
# ---------------------------------------------------------------------------
# ACTIVE parcel extraction method — no model training required.

# Implemented by:
#   steps/04_predict/parcels/predict.py
#   steps/05_vectorise/parcels/vectorise.py

# Inputs:
#   - Full-sheet boundary raster produced by the lines pipeline.
#   - Apportionment centroid points.

# Method:
#   A marker-controlled watershed is used to partition the sheet:
#   - Each centroid point acts as a seed.
#   - Smoothed boundary lines act as watershed ridges.
#   - Each pixel is assigned to its enclosing parcel.

# Parcel extent is determined by the boundary lines, so parcel size can vary
# substantially without requiring any additional configuration.




# With N input points, the method produces N parcels.
parcels:
  points_file: apportionment_points.gpkg   # Default filename within paths.parcel_points/.
                                           # A per-sheet file (e.g. <sheet>_points.gpkg)
                                           # takes precedence when present.
  # Watershed surface shaping - bridges the dashed/gappy boundaries that defeat
  # strict polygonisation. The seeds supply closure; the lines only bias where
  # adjacent parcels are cut apart.
  boundary_smooth_sigma: 2.0    # Gaussian blur (px) turning dashed/broken lines into soft
                                #   continuous ridges. 0 = off. Raise to bridge bigger gaps.
  boundary_close_px:     3      # morphological closing (px) before smoothing, to join colinear
                                #   dashes. 0 = off.
  seed_dilate_px:        4      # radius (px) each apportionment seed is grown to (robustness)
  compactness:           0.0    # skimage watershed compactness. 0 = follow boundaries strictly;
                                #   small values (e.g. 1e-3) add a Voronoi-like pull where the
                                #   boundary is missing entirely.
  use_map_mask:          true   # constrain the watershed to data/map_area_masks/<sheet> if present
  min_region_px:         64     # drop watershed regions smaller than this many px before vectorising

  # Which features define parcel extent.
  #   extent_features  - footprints that act as a WALL the flood will not cross
  #                      (they stay inside parcels; a building keeps its enclosing parcel).
  #   exclude_features - features CARVED OUT of every parcel (become holes - for
  #                      lakes/rivers that belong to no parcel).
  # Each name maps to a stitched raster data/stitched/<name>/<sheet>.tif, except
  # 'boundaries'/'dashed' which prefer a mended GeoPackage line layer when present.
  # 'lines' is an alias for 'boundaries'. Override per-run with --extent / --exclude.
  extent_features:       [boundaries]   # e.g. [boundaries, dashed, building, water]
  exclude_features:      []             # e.g. [water]  (removed from all parcels)
  dashed_barrier_weight: 0.6    # ridge height for dashed lines vs 1.0 for solid boundaries. Softer,
                                #   because a dashed line is often a path, not a border. Two seeds
                                #   either side of a dashed line still separate; a dashed pathway
                                #   corridor with no seed inside is absorbed into a neighbour.
  feature_barrier_weight: 1.0   # ridge height for areal barrier features (building/water outlines)

  # Recorded-size guidance (fuzzy cap against runaway parcels). Where a real border
  # is missing the flood runs until it meets another parcel. If the apportionment
  # table records an area, each parcel is capped to the nearest-to-seed pixels up to
  # size_factor x recorded area, releasing the overflow to background for the
  # operator to mend. Only parcels over the tolerance are touched.
  use_recorded_size: true     # off if the points file has no usable area column
  size_column:       null     # area column name; null = auto-detect common names
  size_unit:         acres    # acres | ha | m2 | perches - unit of size_column values
  size_factor:       1.8      # allow up to this x recorded area before trimming (fuzzy)

  mended_line_width_px: 3     # px width to rasterise mended boundary lines at (used by
                              #   parcels/predict.py --mended; location is paths.outputs_mended).

  # Shared with parcels/vectorise.py (attribute join + GeoPackage write):
  min_area:           50.0    # discard parcels smaller than this (CRS units squared)
  simplify_tolerance: 1.0     # Douglas-Peucker tolerance in CRS units

# Text spotting via MapTextPipeline (MapReader's MapTextRunner) - runs in the
# polygons conda environment. steps/04_predict/text/predict.py.
text:
  cfg_file: models/MapTextPipeline/configs/ViTAEv2_S/rumsey/final_rumsey.yaml
  tile_n:   1          # assemble tile_n x tile_n patches into one image before inference.
                       #   1 = one forward pass per patch (recommended for <=8 GB VRAM). tile_n=2 is
                       #   ~3-4x throughput but needs ~16 GB VRAM for 1024px tiles (RTX 3050 4 GB OOMs).
  min_ioa:  0.7        # deduplication IoA threshold - higher = tighter (keeps more boxes)
  device:   default    # "cuda", "cpu", or "default" (auto-selects cuda if available)
  # The confidence threshold lives in cfg_file (TRANSFORMER.INFERENCE_TH_TEST: 0.4).
  # Weight search order: --weights -> models/base/MapTextPipeline/*.pth -> models/finetuned/*text*.pth
