# -----------------------------------------------------------------------------
# Cadastral Map Vectorisation Toolkit - pipeline configuration
#
# Every step reads this file from the repo root. Values are grouped by the step
# that uses them. Metric thresholds (simplify_tolerance, min_length, min_area,
# the parcel size cap) are in linear CRS units - metres in any projected CRS,
# pixels for ungeoreferenced sheets.
# -----------------------------------------------------------------------------

# Data and model directories, all relative to the repo root.
paths:
  raw:              data/raw/
  masks:            data/map_area_masks/
  patches:          data/patches/
  annotations:      data/annotations/
  predictions:      data/predictions/
  stitched:         data/stitched/
  outputs:          data/outputs/
  outputs_mended:   data/mended outputs/   # hand-corrected GeoPackages; written to only with --mended
  models_base:      models/base/
  models_finetuned: models/finetuned/
  logs:             models/logs/
  parcel_points:    data/parcel_points/

# Optional ingest step (steps/01_patchify/reproject.py) that warps a georeferenced
# map to a tiled GeoTIFF in the target CRS at data/raw/<sheet>/<sheet>.tif (which
# find_raw then prefers over the source). Run it before patchify for maps not
# already in a projected metre CRS at the training scale - e.g. WGS84/degree scans
# (patchify errors on a degree CRS). target_crs may be any projected metre CRS
# (BNG, UTM, Irish Grid, ...); ungeoreferenced inputs have no CRS and are skipped.
reproject:
  target_crs: EPSG:27700   # default British National Grid (metres); set to your CRS if different
  resolution: 0.5          # metres per pixel - matches the ~0.5 m/px training data
  resampling: bilinear     # nearest | bilinear | cubic | lanczos | average

# Slicing the raw map into patches (steps/01_patchify/patchify.py).
patchify:
  patch_size:        512    # px - boundaries/MapSAM use 512px patches directly;
                            #   the text model stitches 2x2 patches to 1024px before inference
  overlap:           0      # px between adjacent patches
  min_mask_coverage: 0.01   # fraction of a patch that must fall within the mask (0.01 = 1%)
  pad_value:         255    # fill value for edge patches (255 = white)

# Boundary-line U-Net (steps/03_finetune/lines, steps/04_predict/lines).
unet:
  inference_size: 256    # model input size; 512px patches are split into a 2x2 grid of
                         #   256px tiles (4 total) - matches training resolution exactly, no downsampling
  image_channels: 1      # grayscale
  loss_type:      combined_focal_cldice
  threshold:      0.95   # from threshold calibration on the validation set
  batch_size:     4

# Dashed-line U-Net (EfficientNetB0 encoder regressing a Gaussian heatmap) for
# dashed/gappy boundary lines - see models/DashedLineUNet/. Trained POOLED across
# all annotated sheets (not per-sheet), since the dataset is small enough that a
# single cross-sheet model was what was actually validated.
dashed:
  img_size:            512    # native patch size - no 2x2 tiling, unlike unet.inference_size
  sigma:               8      # Gaussian blur (px) on the annotated linestrip to make the regression
                              #   target - a continuous target is what lets the model bridge ink gaps
  foreground_weight:   15.0   # up-weights on-line pixels in the loss (see architecture.py); without
                              #   it the model collapses to predicting near-zero everywhere
  unfreeze_from_layer: block6a_expand_activation   # Phase 2 fine-tunes from here up; earlier,
                                                    #   more generic encoder blocks stay frozen
  batch_size:          4
  batch_size_finetune: 2      # Phase 2 (partial unfreeze) batch size - OOM guard
  epochs:              60
  learning_rate:       0.0001
  finetune_lr_divisor: 50     # Phase 2 learning rate = learning_rate / this
  val_split:           0.15
  seed:                42
  predict_threshold:   0.70   # from a threshold sweep (best F1 ~ 0.59, P ~ 0.60, R ~ 0.69).
                              #   Known limitation: detects on-line pixels well but does not yet
                              #   discriminate the dashed line from other faint lines in a cluttered
                              #   patch - expect more mending than the "boundaries" layer for now.

# Vectorising stitched prediction rasters to GeoPackage layers (steps/05_vectorise).
vectorise:
  boundaries:
    simplify_tolerance: 2.0    # Douglas-Peucker tolerance in CRS units. Increase to generalise more.
    min_length:         10.0   # discard lines shorter than this (same units)
    topology_repair:
      enabled:         false   # set true to add bridging segments after vectorisation
      snap_distance:   15.0    # maximum gap to bridge, in CRS units. Keep conservative -
                               #   a good starting point is 3-5x simplify_tolerance
      angle_tolerance: null    # degrees; null = bridge any nearby endpoint pair.
                               #   Set e.g. 25 to restrict to roughly collinear lines only
                               #   (avoids bridging two unrelated boundaries at a corner)
  dashed:
    simplify_tolerance: 2.0
    min_length:         10.0
    topology_repair:
      enabled:         false   # dashed lines are gappy by definition - worth trying true if the
                               #   raw traced output still looks broken after mending a sheet or two
      snap_distance:   15.0
      angle_tolerance: null

  # MapSAM polygon features - any label becomes its own class. A per-feature entry
  # takes precedence; "default" is used when no specific entry exists.
  features:
    default:
      simplify_tolerance: 2.0    # Douglas-Peucker tolerance in CRS units
      min_area:           25.0   # discard polygons smaller than this (same units squared)
    # Per-feature overrides - uncomment and adjust as needed:
    # water:
    #   simplify_tolerance: 3.0
    #   min_area: 50.0
    # building:
    #   simplify_tolerance: 1.0
    #   min_area: 10.0

# MapSAM feature segmentation (SAM ViT-B + DoRA adapters).
# No per-feature config: the feature name comes from the --feature CLI argument and
# weights are resolved automatically -
#   1. models/finetuned/mapsam_<feature>*_best.pth
#   2. models/base/MapSAM/<feature>/          (feature-specific base weights)
#   3. models/base/MapSAM/original_weights/   (generic SAM DoRA fallback)
# Annotation data is read from data/annotations/<feature>/<sheet>/.
mapsam:
  vit_name:           vit_b
  img_size:           512
  num_classes:        1
  rank:               4     # DoRA rank - must match the value used when base weights were trained
  dice_param:         0.8   # dice vs focal weight in the combined loss (0.8 = 80% dice, 20% focal)
  predict_threshold:  0.5   # sigmoid threshold for the binary mask during inference
  predict_batch_size: 4     # patches per GPU forward pass; reduce to 1-2 if OOM
  finetune:
    epochs:                  30
    batch_size:              2        # safe for ~4 GB GPU at 512px SAM ViT-B; reduce to 1 if OOM
    learning_rate:           0.0001   # much lower than base training (0.005) - nudge existing weights
    val_split:               0.15
    early_stopping_patience: 10
    seed:                    1234

# Boundary U-Net fine-tuning (steps/03_finetune/lines/train.py).
finetune:
  epochs:                  50
  learning_rate:           0.0001   # lower than build_model default (1e-3) for fine-tuning
  val_split:               0.15     # fraction of patches held out for validation
  apl_tau:                 3        # coverage tolerance in pixels for APL / path-F1
  max_val_tiles:           200      # cap validation tiles per epoch for speed
  early_stopping_patience: 10       # stop if path_f1 doesn't improve for this many epochs
  # checkpoint_metric is always path_f1 (documented here, not configurable).

# Boundary feedback fine-tuning (step 06) - runs AFTER mending in QGIS.
# Run lines/prepare.py (maptools) then lines/train.py (lines).
feedback:
  replay_ratio:            0.4      # fraction of each batch from the ground-truth replay pool
                                    #   (0.4 = 40% GT tiles, 60% feedback tiles)
  feedback_loss_weight:    0.8      # loss weight for pseudo-label tiles (ground-truth = 1.0) -
                                    #   reduces the influence of any uncorrected prediction errors
  freeze_encoder_blocks:   2        # freeze first N of 4 encoder stages (0 = none, 4 = all).
                                    #   Blocks 1-2 encode low-level edge/texture features; freezing
                                    #   them preserves cross-map generalisability
  learning_rate:           1.0e-5   # much lower than the initial fine-tune (1e-4) - a small nudge only
  epochs:                  20
  early_stopping_patience: 5        # stops when cross-sheet Path-F1 stops improving
  max_val_tiles:           200      # cap on validation tiles evaluated per epoch

# Annotation export (steps/02_annotate/export_masks.py).
# Every unique label drawn in labelme becomes its own feature class - the label
# name is used directly as the annotations subfolder (e.g. "water" -> annotations/water/).
# boundary_label is the one label rendered as a linestrip; all others are filled polygons.
annotation:
  boundary_label: boundary
  line_width:     3    # px width used when rendering linestrip annotations into masks

# Point-seeded watershed parcel extraction (ACTIVE method - no model training).
# steps/04_predict/parcels/predict.py  +  steps/05_vectorise/parcels/vectorise.py
# Consumes the full-sheet boundary raster the lines pipeline produces plus the
# apportionment centroid points, then partitions the sheet with a marker-controlled
# watershed: each point is a seed, the (smoothed) boundary lines are ridges, and
# every pixel is assigned to its enclosing parcel. Extent is defined by the lines,
# so it handles wildly different parcel sizes natively, and N points -> N parcels.
parcels:
  points_file: apportionment_points.gpkg   # filename within paths.parcel_points/ - set per project.
                                           #   A per-sheet file (e.g. <sheet>_points.gpkg) is picked
                                           #   up automatically and takes precedence over this default.

  # Watershed surface shaping - bridges the dashed/gappy boundaries that defeat
  # strict polygonisation. The seeds supply closure; the lines only bias where
  # adjacent parcels are cut apart.
  boundary_smooth_sigma: 2.0    # Gaussian blur (px) turning dashed/broken lines into soft
                                #   continuous ridges. 0 = off. Raise to bridge bigger gaps.
  boundary_close_px:     3      # morphological closing (px) before smoothing, to join colinear
                                #   dashes. 0 = off.
  seed_dilate_px:        4      # radius (px) each apportionment seed is grown to (robustness)
  compactness:           0.0    # skimage watershed compactness. 0 = follow boundaries strictly;
                                #   small values (e.g. 1e-3) add a Voronoi-like pull where the
                                #   boundary is missing entirely.
  use_map_mask:          true   # constrain the watershed to data/map_area_masks/<sheet> if present
  min_region_px:         64     # drop watershed regions smaller than this many px before vectorising

  # Which features define parcel extent.
  #   extent_features  - footprints that act as a WALL the flood will not cross
  #                      (they stay inside parcels; a building keeps its enclosing parcel).
  #   exclude_features - features CARVED OUT of every parcel (become holes - for
  #                      lakes/rivers that belong to no parcel).
  # Each name maps to a stitched raster data/stitched/<name>/<sheet>.tif, except
  # 'boundaries'/'dashed' which prefer a mended GeoPackage line layer when present.
  # 'lines' is an alias for 'boundaries'. Override per-run with --extent / --exclude.
  extent_features:       [boundaries]   # e.g. [boundaries, dashed, building, water]
  exclude_features:      []             # e.g. [water]  (removed from all parcels)
  dashed_barrier_weight: 0.6    # ridge height for dashed lines vs 1.0 for solid boundaries. Softer,
                                #   because a dashed line is often a path, not a border. Two seeds
                                #   either side of a dashed line still separate; a dashed pathway
                                #   corridor with no seed inside is absorbed into a neighbour.
  feature_barrier_weight: 1.0   # ridge height for areal barrier features (building/water outlines)

  # Recorded-size guidance (fuzzy cap against runaway parcels). Where a real border
  # is missing the flood runs until it meets another parcel. If the apportionment
  # table records an area, each parcel is capped to the nearest-to-seed pixels up to
  # size_factor x recorded area, releasing the overflow to background for the
  # operator to mend. Only parcels over the tolerance are touched.
  use_recorded_size: true     # off if the points file has no usable area column
  size_column:       null     # area column name; null = auto-detect common names
  size_unit:         acres    # acres | ha | m2 | perches - unit of size_column values
  size_factor:       1.8      # allow up to this x recorded area before trimming (fuzzy)

  mended_line_width_px: 3     # px width to rasterise mended boundary lines at (used by
                              #   parcels/predict.py --mended; location is paths.outputs_mended).

  # Shared with parcels/vectorise.py (attribute join + GeoPackage write):
  min_area:           50.0    # discard parcels smaller than this (CRS units squared)
  simplify_tolerance: 1.0     # Douglas-Peucker tolerance in CRS units

# Text spotting via MapTextPipeline (MapReader's MapTextRunner) - runs in the
# polygons conda environment. steps/04_predict/text/predict.py.
text:
  cfg_file: models/MapTextPipeline/configs/ViTAEv2_S/rumsey/final_rumsey.yaml
  tile_n:   1          # assemble tile_n x tile_n patches into one image before inference.
                       #   1 = one forward pass per patch (recommended for <=8 GB VRAM). tile_n=2 is
                       #   ~3-4x throughput but needs ~16 GB VRAM for 1024px tiles (RTX 3050 4 GB OOMs).
  min_ioa:  0.7        # deduplication IoA threshold - higher = tighter (keeps more boxes)
  device:   default    # "cuda", "cpu", or "default" (auto-selects cuda if available)
  # The confidence threshold lives in cfg_file (TRANSFORMER.INFERENCE_TH_TEST: 0.4).
  # Weight search order: --weights -> models/base/MapTextPipeline/*.pth -> models/finetuned/*text*.pth

# -----------------------------------------------------------------------------
# ARCHIVED: point-prompted SAM parcel approach (superseded by the watershed above).
# Kept for reference only - scripts live in temp/sam_parcels/ and no active script
# reads these keys. To revive, restore temp/sam_parcels/* and rename these keys back
# to `parcels:` / `parcel_finetune:`.
# -----------------------------------------------------------------------------
sam_parcels_archived:
  points_file:       apportionment_points.gpkg
  tile_size:         1024
  sam_input_size:    1024
  overlap:           128
  min_area:          50.0
  simplify_tolerance: 1.0
  max_neg_points:    6
  adaptive_scale:    true
  border_margin_px:  4
  adaptive_max_fill: 0.80

parcel_finetune_archived:
  epochs:                  40
  batch_size:              1
  learning_rate:           0.00005
  val_split:               0.15
  early_stopping_patience: 12
  seed:                    1234
  replay_ratio:            0.4
  min_zoom_area_px:        1500
  neg_points:              0
  neg_ring_px:             48
